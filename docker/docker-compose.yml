services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zhongbang
      MYSQL_USER: zhongbang
      MYSQL_PASSWORD: zhongbang
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql_data:
