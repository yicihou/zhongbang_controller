server:
  port: 8080

spring:
  application:
    name: zhongbang-controller
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

zhongbang:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  redis:
    enabled: false
  rabbitmq:
    enabled: false
  h2-console:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:zhongbang-dev-only-secret-change-me-32bytes!!}
    expires-seconds: 2592000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
