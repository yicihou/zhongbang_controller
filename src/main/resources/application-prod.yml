# 生产配置。数据库地址和 JWT 密钥没有默认值，必须由环境变量提供，否则启动失败。
# 这里没有写 Redis / Rabbit 的主机。开关打开后，连接用 Spring Boot 默认值（本机 6379 / 5672），
# 或另外用 SPRING_DATA_REDIS_HOST、SPRING_RABBITMQ_HOST 这类变量覆盖。
# 不要和 dev 一起激活。

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

zhongbang:
  demo:
    # 生产环境不能生成演示客户。
    enabled: false
    auto-seed: false
  redis:
    enabled: true
  rabbitmq:
    enabled: true
  jwt:
    # 没有默认密钥。未设置 JWT_SECRET 时应用起不来，避免生产沿用仓库里的开发密钥。
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true

logging:
  level:
    root: WARN
    com.zhongbang.controller: INFO
