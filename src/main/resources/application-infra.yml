# Use instead of (not stacked with) `dev` when Redis/RabbitMQ/MySQL from docker/compose are up:
#   SPRING_PROFILES_ACTIVE=infra
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zhongbang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:zhongbang}
    password: ${DB_PASSWORD:zhongbang}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

zhongbang:
  redis:
    enabled: true
  rabbitmq:
    enabled: true

management:
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true
