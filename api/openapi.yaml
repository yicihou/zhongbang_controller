openapi: 3.0.3
info:
  title: 缝纫机经销商小程序 API
  version: 1.0.0
  description: |
    客户端（微信小程序）、师傅端、商家后台共用的 HTTP 接口。

    **通用约定**
    - 统一响应体：`{code, msg, data, traceId}`，`code = 0` 表示成功。
    - 金额一律为**整数，单位「分」**；前端负责除以 100 展示。
    - 时间格式 `yyyy-MM-dd HH:mm:ss`（东八区）；日期 `yyyy-MM-dd`。
    - 分页：请求 `page`（从 1 开始）、`size`（默认 20，最大 100），响应 `{list,total,page,size}`。
    - 鉴权：`Authorization: Bearer <JWT>`，登录接口与商品公开接口除外。
    - 幂等：下单等写接口需带 `requestId`（UUID），10 分钟内重复请求返回同一结果。
  contact:
    name: 缝纫机经销商小程序项目组
servers:
  - url: http://127.0.0.1:8080
    description: 本地 Mock / 开发环境
  - url: https://api.example.com
    description: 生产环境
tags:
  - {name: 认证, description: 微信登录与手机号绑定}
  - {name: 首页, description: 小程序首页聚合数据}
  - {name: 商品, description: 机型、配置与分类}
  - {name: 师傅, description: 可预约的安装/维修师傅}
  - {name: 订单, description: 下单、查询、取消、验收}
  - {name: 支付, description: 微信支付下单与回调}
  - {name: 客户, description: 我的、地址簿}
  - {name: 设备, description: 一机一码设备档案}
  - {name: 报修, description: 报修申请、报价确认}
  - {name: 评价, description: 安装/维修评价}
  - {name: 文件, description: 对象存储直传签名}
  - {name: 师傅端, description: 师傅工作台}
  - {name: 后台, description: 商家管理后台}
security:
  - bearerAuth: []
paths:

  /api/auth/login:
    post:
      tags: [认证]
      summary: 微信登录
      description: 小程序 `wx.login` 拿到 code 后调用。后端用 code 换 openid，不存在则静默建档。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, description: wx.login 返回的 code, example: "081Kq7Ga1x..."}
            example: {code: "081Kq7Ga1xYzAbCd"}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RLogin'}
              example:
                code: 0
                msg: ok
                traceId: 3f8a91c2
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDAxIn0.xxx
                  expiresIn: 2592000
                  hasMobile: false
                  customer: {id: 1001, nickname: "", avatar: "", mobile: "", level: 1, levelText: 普通客户}

  /api/auth/staff-login:
    post:
      tags: [认证]
      summary: 管理端登录（P1a stub）
      description: 本地/演示用；按 `sys_user.username` 签发 STAFF JWT，暂不校验密码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, example: admin}
            example: {username: admin}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              example:
                code: 0
                msg: ok
                data: {token: eyJ..., expiresIn: 2592000, userId: 9001, username: admin, role: STAFF}

  /api/auth/phone:
    post:
      tags: [认证]
      summary: 绑定手机号
      description: 手机号快速验证组件拿到的 code。**手机号是客户唯一业务标识**，同号自动合并档案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: "e3f1..."}
            example: {code: "e3f1a2b3c4"}
      responses:
        '200':
          description: 绑定成功，返回新 token（含手机号信息）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RLogin'}
              example:
                code: 0
                msg: ok
                traceId: 3f8a91c3
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.xxx
                  expiresIn: 2592000
                  hasMobile: true
                  customer: {id: 1001, nickname: "张建国", avatar: "", mobile: "138****8000", level: 3, levelText: 金卡客户}

  /api/home:
    get:
      tags: [首页]
      summary: 首页聚合数据
      description: 一次返回 banner、快捷入口、分类与热销机型，避免首屏多次请求。
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RHome'}
              example:
                code: 0
                msg: ok
                traceId: a1b2c3
                data:
                  banners:
                    - {id: 1, image: "", title: "新机到家，师傅上门", subtitle: "下单可选安装师傅 · 验收后再付尾款", linkType: PRODUCT_LIST, linkValue: "1"}
                  quickEntries:
                    - {code: BUY, title: 买机器, icon: 机, badge: ""}
                    - {code: REPAIR, title: 一键报修, icon: 修, badge: ""}
                    - {code: ASSET, title: 我的设备, icon: 档, badge: "3"}
                    - {code: INVOICE, title: 发票/对账, icon: 票, badge: ""}
                  categories:
                    - {id: 1, name: 家用多功能, count: 12}
                    - {id: 2, name: 工业平缝, count: 9}
                    - {id: 3, name: 包缝绷缝, count: 6}
                    - {id: 4, name: 特种机, count: 5}
                  hotProducts:
                    - {id: 101, name: "电脑平缝机 A5", model: "A5-5000", coverImage: "", price: 328000, depositAmount: 98400, stock: 12, tags: [含上门安装, 现货]}
                    - {id: 102, name: "家用多功能机 M3", model: "M3", coverImage: "", price: 158000, depositAmount: 47400, stock: 20, tags: [含教学]}
                    - {id: 103, name: "四线包缝机 E4", model: "E4-7000", coverImage: "", price: 690000, depositAmount: 207000, stock: 3, tags: [现货 3 台]}
                    - {id: 104, name: "电脑绣花机 12 头", model: "EM-12", coverImage: "", price: 6800000, depositAmount: 2040000, stock: 2, tags: [可分期]}

  /api/categories:
    get:
      tags: [商品]
      summary: 机型分类
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer}
                  msg: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Category'}
                  traceId: {type: string}
              example:
                code: 0
                msg: ok
                traceId: a1b2c4
                data:
                  - {id: 1, name: 家用多功能, count: 12}
                  - {id: 2, name: 工业平缝, count: 9}
                  - {id: 3, name: 包缝绷缝, count: 6}
                  - {id: 4, name: 特种机, count: 5}

  /api/products:
    get:
      tags: [商品]
      summary: 机型列表
      security: []
      parameters:
        - {name: categoryId, in: query, schema: {type: integer}, description: 分类 ID，不传为全部}
        - {name: keyword, in: query, schema: {type: string}, description: 名称/型号模糊搜索}
        - {name: sort, in: query, schema: {type: string, enum: [default, price_asc, price_desc, sales_desc]}, description: 排序}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RPageProduct'}
              example:
                code: 0
                msg: ok
                traceId: a1b2c5
                data:
                  total: 32
                  page: 1
                  size: 20
                  list:
                    - {id: 101, name: "电脑平缝机 A5", model: "A5-5000", coverImage: "", price: 328000, depositAmount: 98400, stock: 12, tags: [含上门安装, 现货]}
                    - {id: 102, name: "家用多功能机 M3", model: "M3", coverImage: "", price: 158000, depositAmount: 47400, stock: 20, tags: [含教学]}
                    - {id: 103, name: "四线包缝机 E4", model: "E4-7000", coverImage: "", price: 690000, depositAmount: 207000, stock: 3, tags: [现货 3 台]}

  /api/products/{id}:
    get:
      tags: [商品]
      summary: 机型详情
      description: 返回图文、参数、可选配置（SKU）、定金比例与保修说明。价格与库存为实时值。
      security: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RProductDetail'}
              example:
                code: 0
                msg: ok
                traceId: a1b2c6
                data:
                  id: 101
                  name: 电脑平缝机 A5
                  model: A5-5000
                  subtitle: 直驱 · 自动剪线 · 5000 针/分
                  brand: 标准牌
                  categoryId: 2
                  images: []
                  videoUrl: ""
                  price: 328000
                  depositRate: 30
                  depositAmount: 98400
                  stock: 12
                  warranty: {months: 12, motorMonths: 24, desc: "整机 12 个月，电机电控 24 个月，以安装完成日起算"}
                  services: [含上门安装调试, 含首次操作培训, 可开增值税专用发票]
                  specs:
                    - {name: 最高转速, value: "5000 针/分"}
                    - {name: 适用场景, value: "服装厂流水线 / 加工坊"}
                    - {name: 电压, value: "220V"}
                    - {name: 整机重量, value: "32 kg"}
                  skus:
                    - {id: 1011, name: "标准台板 + 伺服电机", specs: 台板:标准, 电机:伺服, price: 328000, depositAmount: 98400, stock: 8}
                    - {id: 1012, name: "加厚台板 + 伺服电机", specs: 台板:加厚, 电机:伺服, price: 336000, depositAmount: 100800, stock: 4}
                    - {id: 1013, name: "标准台板 + 直驱电机", specs: 台板:标准, 电机:直驱, price: 354000, depositAmount: 106200, stock: 0}

  /api/technicians/available:
    get:
      tags: [师傅]
      summary: 可预约师傅
      description: 按技能匹配、档期、距离、评分排序。客户不指定时由系统派单。
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}, description: 期望上门日期，默认明天}
        - {name: skuId, in: query, schema: {type: integer}, description: 用于技能匹配}
        - {name: sort, in: query, schema: {type: string, enum: [recommend, distance, rating]}, description: 排序方式}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RTechnicianList'}
              example:
                code: 0
                msg: ok
                traceId: a1b2c7
                data:
                  - {id: 88, name: 王师傅, avatar: "", rating: 4.9, orderCount: 186, distanceKm: 2.4, skills: [平缝, 包缝, 电控调试], intro: "8 年安装经验，擅长流水线调试", recommended: true, freeSlots: [{date: "2025-11-28", slot: AM, text: "11-28 上午"}, {date: "2025-11-28", slot: PM, text: "11-28 下午"}]}
                  - {id: 89, name: 李师傅, avatar: "", rating: 4.7, orderCount: 243, distanceKm: 5.1, skills: [绣花机, 特种机], intro: "擅长绣花机与特种机", recommended: false, freeSlots: [{date: "2025-11-27", slot: AM, text: "11-27 上午"}, {date: "2025-11-28", slot: PM, text: "11-28 下午"}]}

  /api/cart:
    get:
      tags: [订单]
      summary: 购物车列表（P1a）
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                code: 0
                msg: ok
                data:
                  - {id: 1, skuId: 1011, productName: 电脑平缝机 A5, skuName: "标准台板 + 伺服电机", unitPrice: 328000, quantity: 1, deliveryMethod: EXPRESS, needInstall: false, lineAmount: 328000}
    post:
      tags: [订单]
      summary: 加入购物车（P1a）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId: {type: integer, format: int64}
                quantity: {type: integer, minimum: 1}
                deliveryMethod: {type: string, enum: [EXPRESS, FREIGHT, HOME_DELIVERY, ON_SITE_INSTALL, STORE_PICKUP]}
            example: {skuId: 1011, quantity: 1, deliveryMethod: EXPRESS}
      responses:
        '200':
          description: OK

  /api/cart/items/{id}:
    put:
      tags: [订单]
      summary: 更新购物车行（P1a）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId: {type: integer, format: int64}
                quantity: {type: integer, minimum: 1}
                deliveryMethod: {type: string}
      responses:
        '200':
          description: OK
    delete:
      tags: [订单]
      summary: 删除购物车行（P1a）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK

  /api/orders:
    post:
      tags: [订单]
      summary: 提交订单（多行，P1a）
      description: |
        P1a：`items[]` 多行下单；服务端按标价合计 `goodsAmount`，`freightAmount=0`，
        默认创建一笔 `payment(type=FULL, status=WAIT, channel=OFFLINE)`，订单 `PENDING_PAYMENT`，
        并 SSE 推送 `ORDER_CREATED`。
        接口幂等：同 `requestId` 10 分钟内重复提交返回同一订单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, items]
              properties:
                requestId: {type: string}
                addressId: {type: integer, format: int64}
                remark: {type: string}
                items:
                  type: array
                  items:
                    type: object
                    required: [skuId, quantity, deliveryMethod]
                    properties:
                      skuId: {type: integer, format: int64}
                      quantity: {type: integer, minimum: 1}
                      deliveryMethod: {type: string, enum: [EXPRESS, FREIGHT, HOME_DELIVERY, ON_SITE_INSTALL, STORE_PICKUP]}
                      installDate: {type: string, format: date}
                      installSlot: {type: string}
                      technicianId: {type: integer, format: int64}
            example:
              requestId: 8f1c2e4a-6b7d-4c1e-9a2f-1d3e5b7c9a01
              items:
                - {skuId: 1011, quantity: 1, deliveryMethod: EXPRESS}
                - {skuId: 2011, quantity: 2, deliveryMethod: EXPRESS}
              remark: 混购一单
      responses:
        '200':
          description: 下单成功，返回待支付订单
          content:
            application/json:
              example:
                code: 0
                msg: ok
                traceId: a1b2d1
                data:
                  id: 910233001
                  orderNo: O20251123000123
                  status: PENDING_PAYMENT
                  goodsAmount: 345600
                  installAmount: 0
                  freightAmount: 0
                  payableAmount: 345600
                  paidAmount: 0
                  items:
                    - {skuId: 1011, quantity: 1, deliveryMethod: EXPRESS, lineAmount: 328000}
                    - {skuId: 2011, quantity: 2, deliveryMethod: EXPRESS, lineAmount: 17600}
                  payments:
                    - {type: FULL, title: 全款, amount: 345600, status: WAIT}
        '400':
          description: 2001 参数错误 / 3001 库存不足 / 3002 档期冲突 / 4001 重复请求
          content:
            application/json:
              example: {code: 3002, msg: "师傅 11-28 上午档期已满", traceId: a1b2d2, data: null}
    get:
      tags: [订单]
      summary: 我的订单
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [ALL, UNPAID, DEPOSIT_PAID, INSTALLING, PENDING_BALANCE, COMPLETED, AFTER_SALE]}, description: 不传为全部}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RPageOrder'}
              example:
                code: 0
                msg: ok
                traceId: a1b2d3
                data:
                  total: 9
                  page: 1
                  size: 20
                  list:
                    - {id: 910233001, orderNo: SO20251123000123, status: PENDING_BALANCE, statusText: 待付尾款, totalAmount: 328000, paidAmount: 98400, balanceAmount: 229600, createdAt: "2025-11-23 20:14:00", installDate: "2025-11-28", technicianName: 王师傅, items: [{skuId: 1011, name: 电脑平缝机 A5, skuName: "标准台板 + 伺服电机", coverImage: "", price: 328000, quantity: 1}]}
                    - {id: 910233002, orderNo: SO20251123000045, status: INSTALLING, statusText: 安装中, totalAmount: 690000, paidAmount: 207000, balanceAmount: 483000, createdAt: "2025-11-23 09:02:00", installDate: "2025-11-25", technicianName: 李师傅, items: [{skuId: 1031, name: 四线包缝机 E4, skuName: 标准配置, coverImage: "", price: 690000, quantity: 1}]}

  /api/orders/{id}:
    get:
      tags: [订单]
      summary: 订单详情
      description: 含时间轴、收款记录、师傅信息与可执行动作（actions），前端据此渲染按钮。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ROrderDetail'}
              example:
                code: 0
                msg: ok
                traceId: a1b2d4
                data:
                  id: 910233001
                  orderNo: SO20251123000123
                  status: PENDING_BALANCE
                  statusText: 待付尾款
                  totalAmount: 328000
                  paidAmount: 98400
                  balanceAmount: 229600
                  createdAt: "2025-11-23 20:14:00"
                  installDate: "2025-11-28"
                  installSlot: AM
                  remark: 厂房在 3 楼，有货梯
                  technician: {id: 88, name: 王师傅, mobile: 138****8000, rating: 4.9}
                  address: {id: 55801, name: 张建国, mobile: 138****8000, province: 浙江省, city: 杭州市, district: 余杭区, detail: "某某街道 128 号 3 楼", isDefault: true}
                  invoice: {need: true, title: "杭州某某服饰有限公司", taxNo: "91330100MA2XXXXX"}
                  items: [{skuId: 1011, name: 电脑平缝机 A5, skuName: "标准台板 + 伺服电机", coverImage: "", price: 328000, quantity: 1}]
                  payments:
                    - {id: 501, type: DEPOSIT, typeText: 定金, amount: 98400, status: SUCCESS, paidAt: "2025-11-23 20:16:22"}
                  timeline:
                    - {status: UNPAID, title: 提交订单, desc: 等待支付定金, time: "2025-11-23 20:14:00", done: true, current: false}
                    - {status: DEPOSIT_PAID, title: 已付定金, desc: "已派单给王师傅", time: "2025-11-23 20:16:22", done: true, current: false}
                    - {status: PENDING_BALANCE, title: 安装完成待付尾款, desc: "客户已验收，尾款 ¥2,296", time: "2025-11-28 14:20:00", done: true, current: true}
                    - {status: COMPLETED, title: 订单完成, desc: 支付尾款后自动完成, time: "", done: false, current: false}
                  expireAt: ""
                  actions: [PAY_BALANCE, CALL_TECHNICIAN, REPAIR]

  /api/orders/{id}/cancel:
    post:
      tags: [订单]
      summary: 取消订单
      description: 仅 `UNPAID` 状态可自助取消；已付定金需走退款审批（REFUNDING）。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, example: 下错型号}
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: {code: 0, msg: ok, traceId: a1b2d5, data: true}

  /api/orders/{id}/accept:
    post:
      tags: [订单]
      summary: 客户确认验收
      description: 验收通过后订单转 `PENDING_BALANCE` 并生成尾款单；验收不通过走返工。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pass: {type: boolean, example: true}
                remark: {type: string, example: 试缝正常}
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: {code: 0, msg: ok, traceId: a1b2d6, data: {status: PENDING_BALANCE, balanceAmount: 229600}}

  /api/pay/prepay:
    post:
      tags: [支付]
      summary: 发起支付
      description: |
        服务端按订单与类型计算金额并调用微信 v3 JSAPI 下单，返回 `wx.requestPayment` 所需参数。
        `type=BALANCE` 时校验订单是否为 `PENDING_BALANCE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, type]
              properties:
                orderId: {type: integer, example: 910233001}
                type: {type: string, enum: [DEPOSIT, BALANCE, REPAIR], example: DEPOSIT}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RPayParams'}
              example:
                code: 0
                msg: ok
                traceId: a1b2d7
                data:
                  paymentId: 501
                  outTradeNo: SO20251123000123-D
                  amount: 98400
                  payParams:
                    timeStamp: "1732356200"
                    nonceStr: 5K8264ILTKCH16CQ2502SI8ZNMTI6FJ
                    package: prepay_id=wx2311xxxx
                    signType: RSA
                    paySign: oR9d8PuhnIc+YZ8cBHFCwfgpaK9gd7vaRvkYD7rthRAZ

  /api/pay/notify:
    post:
      tags: [支付]
      summary: 微信支付回调
      description: |
        微信服务端调用，**订单状态的唯一可信来源**。验签 → 解密 → 幂等（out_trade_no 唯一索引 + 状态 CAS）→ 推进订单。
        必须返回 HTTP 200 且 `{"code":"SUCCESS"}`，否则微信会重试。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                event_type: {type: string, example: TRANSACTION.SUCCESS}
                resource:
                  type: object
                  properties:
                    ciphertext: {type: string}
                    nonce: {type: string}
                    associated_data: {type: string}
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              example: {code: SUCCESS, message: 成功}

