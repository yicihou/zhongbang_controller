components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: {type: integer}
      description: 资源 ID
    Page:
      name: page
      in: query
      schema: {type: integer, default: 1, minimum: 1}
      description: 页码
    Size:
      name: size
      in: query
      schema: {type: integer, default: 20, maximum: 100}
      description: 每页条数

  schemas:
    Result:
      type: object
      properties:
        code: {type: integer, description: 0 成功，非 0 见错误码}
        msg: {type: string}
        data: {}
        traceId: {type: string}

    Page:
      type: object
      properties:
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
        list: {type: array, items: {}}

    Customer:
      type: object
      properties:
        id: {type: integer}
        nickname: {type: string}
        avatar: {type: string}
        mobile: {type: string, description: 脱敏返回}
        level: {type: integer, description: 1 普通 2 银卡 3 金卡}
        levelText: {type: string}

    RLogin:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: {type: string}
                expiresIn: {type: integer, description: 秒}
                hasMobile: {type: boolean}
                customer: {$ref: '#/components/schemas/Customer'}

    Category:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        count: {type: integer, description: 在售机型数}

    ProductBrief:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        model: {type: string}
        coverImage: {type: string}
        price: {type: integer, description: 分}
        depositAmount: {type: integer}
        stock: {type: integer}
        tags: {type: array, items: {type: string}}

    Sku:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        specs: {type: object, additionalProperties: {type: string}}
        price: {type: integer}
        depositAmount: {type: integer}
        stock: {type: integer}

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductBrief'
        - type: object
          properties:
            subtitle: {type: string}
            brand: {type: string}
            categoryId: {type: integer}
            images: {type: array, items: {type: string}}
            videoUrl: {type: string}
            depositRate: {type: integer, description: 百分比，如 30}
            warranty:
              type: object
              properties:
                months: {type: integer}
                motorMonths: {type: integer}
                desc: {type: string}
            services: {type: array, items: {type: string}}
            specs:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  value: {type: string}
            skus: {type: array, items: {$ref: '#/components/schemas/Sku'}}

    Technician:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        avatar: {type: string}
        rating: {type: number, format: float}
        orderCount: {type: integer}
        distanceKm: {type: number}
        skills: {type: array, items: {type: string}}
        intro: {type: string}
        recommended: {type: boolean}
        freeSlots:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              slot: {type: string, enum: [AM, PM]}
              text: {type: string}

    Address:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        mobile: {type: string}
        province: {type: string}
        city: {type: string}
        district: {type: string}
        detail: {type: string}
        isDefault: {type: boolean}

    OrderItem:
      type: object
      properties:
        skuId: {type: integer}
        name: {type: string}
        skuName: {type: string}
        coverImage: {type: string}
        price: {type: integer}
        quantity: {type: integer}

    OrderBrief:
      type: object
      properties:
        id: {type: integer}
        orderNo: {type: string}
